  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f2f4f8; color: #1a202c;
    padding-bottom: calc(64px + env(safe-area-inset-bottom));
  }
  header {
    background: #1a56db; color: #fff;
    padding: calc(14px + env(safe-area-inset-top)) 16px 14px;
    font-size: 20px; font-weight: 700;
    position: sticky; top: 0; z-index: 10;
  }
  main { max-width: 520px; margin: 0 auto; padding: 16px; }
  .card {
    background: #fff; border-radius: 16px; padding: 20px;
    margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .card h2 { font-size: 20px; margin-bottom: 12px; }
  .card h3 { font-size: 16px; margin: 16px 0 8px; }
  .card p { margin-bottom: 12px; line-height: 1.45; }
  .center { text-align: center; }
  .big-emoji { font-size: 52px; margin-bottom: 8px; }
  .dim { color: #718096; font-size: 14px; }
  .meta { color: #718096; font-size: 13px; margin-bottom: 14px; }
  .ru { font-size: 30px; font-weight: 700; margin: 8px 0 4px; }
  .de-reveal { font-size: 24px; font-weight: 600; margin-top: 16px; color: #1a56db; }
  .info { color: #718096; font-size: 15px; margin-bottom: 8px; }
  .stats { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .stat { flex: 1; min-width: 90px; background: #f2f4f8; border-radius: 12px; padding: 12px 8px; text-align: center; }
  .stat.accent { background: #e3edff; } .stat.good { background: #e6f6ec; }
  .stat-n { font-size: 26px; font-weight: 800; }
  .stat.clickable { cursor:pointer; border:2px solid transparent; }
  .stat.clickable:active { transform:scale(.98); }
  .stat-l { font-size: 13px; color: #4a5568; }
  .btn {
    display: block; width: 100%; margin-top: 10px; padding: 15px;
    font-size: 17px; font-weight: 600; border: none; border-radius: 12px;
    background: #e2e8f0; color: #1a202c; cursor: pointer; text-align: center;
  }
  .btn.primary { background: #1a56db; color: #fff; }
  .btn.ghost { background: transparent; color: #718096; }
  .btn.danger { background: #fde8e8; color: #c53030; }
  .btn small { font-weight: 400; font-size: 13px; opacity: .85; }
  .row { display: flex; gap: 10px; }
  .row .btn { flex: 1; }
  input[type="text"], input[type="number"] {
    width: 100%; padding: 14px; font-size: 20px; border: 2px solid #cbd5e0;
    border-radius: 12px; margin: 10px 0; -webkit-appearance: none; appearance: none;
  }
  input[type="text"]:focus { border-color: #1a56db; outline: none; }
  select { width: 100%; padding: 12px; font-size: 16px; border: 2px solid #cbd5e0; border-radius: 12px; margin: 4px 0 8px; background: #fff; }
  .radio { display: flex; align-items: center; gap: 10px; padding: 10px 0; font-size: 16px; }
  .fb { font-size: 18px; font-weight: 700; margin: 12px 0 4px; }
  .fb.good { color: #2f855a; } .fb.bad { color: #c53030; }
  .fb-answer { font-size: 17px; margin-bottom: 6px; }
  .hang-answer { font-size: 28px; font-weight: 700; letter-spacing: 2px; margin: 18px 0; word-break: break-word; }
  .hang-keys { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; }
  .hang-key { width:auto; min-width:48px; margin:0; padding:12px 16px; font-size:20px; }
  .ru-kbd { margin:8px 0 14px; } .ru-kbd-row { display:flex; justify-content:center; gap:4px; margin:4px 0; }
  .ru-key { flex:1; min-width:0; margin:0; padding:10px 2px; font-size:17px; border:0; border-radius:8px; background:#e2e8f0; color:#1a202c; cursor:pointer; } .ru-key.wide { flex:2.4; font-size:14px; } .ru-key.shift-active { background:#1a56db; color:#fff; }
  .editor-list { max-height: 420px; overflow:auto; margin:10px 0; border:1px solid #e2e8f0; border-radius:12px; }
  .editor-item { display:flex; align-items:flex-start; gap:10px; padding:10px; border-bottom:1px solid #e2e8f0; cursor:pointer; }
  .editor-item:last-child { border-bottom:0; } .editor-item.selected { background:#e3edff; }
  .editor-item input { margin-top:4px; transform:scale(1.2); } .editor-main { flex:1; min-width:0; }
  .editor-main b { display:block; } .editor-actions { display:flex; gap:8px; flex-wrap:wrap; }
  .editor-actions .btn { width:auto; flex:1; min-width:120px; }
  .field-label { display:block; font-size:13px; color:#4a5568; margin-top:8px; }
  .warn li, .failed li { margin-left: 20px; margin-bottom: 4px; font-size: 14px; }
  .warn { color: #b7791f; } .failed b { color: #c53030; }
  table.params { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.params th, table.params td { padding: 6px 8px; text-align: left; border-bottom: 1px solid #e2e8f0; }
  hr { border: none; border-top: 1px solid #e2e8f0; margin: 18px 0; }
  #nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
    display: flex; background: #fff; border-top: 1px solid #e2e8f0;
    padding-bottom: env(safe-area-inset-bottom);
  }
  #nav button {
    flex: 1; padding: 10px 4px calc(10px + env(safe-area-inset-bottom));
    background: none; border: none; font-size: 11px; color: #718096; cursor: pointer;
  }
  #nav button.active { color: #1a56db; font-weight: 700; }
</style>
</head>

  }

  const now = new Date();
  const dosTime = ((now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1)) & 0xFFFF;
  const dosDate = (((Math.max(now.getFullYear(), 1980) - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate()) & 0xFFFF;
  for (const f of files){
    const nameB = enc.encode(f.name);
    const crc = crc32(f.data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true);
    lh.setUint16(4, 20, true);
    lh.setUint16(6, 0x0800, true);
    lh.setUint16(8, 0, true);
    lh.setUint16(10, dosTime, true);
    lh.setUint16(12, dosDate, true);
    lh.setUint32(14, crc, true);
    lh.setUint32(18, f.data.length, true);
    lh.setUint32(22, f.data.length, true);
    lh.setUint16(26, nameB.length, true);
    lh.setUint16(28, 0, true);
    chunks.push(new Uint8Array(lh.buffer), nameB, f.data);
    central.push({ nameB: nameB, crc: crc, size: f.data.length, offset: offset });
    offset += 30 + nameB.length + f.data.length;
  }
  const cdStart = offset;
  for (const c of central){
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true);
    ch.setUint16(4, 20, true);
    ch.setUint16(6, 20, true);
    ch.setUint16(8, 0x0800, true);
    ch.setUint16(10, 0, true);
    ch.setUint16(12, dosTime, true);
    ch.setUint16(14, dosDate, true);
    ch.setUint32(16, c.crc, true);
    ch.setUint32(20, c.size, true);
    ch.setUint32(24, c.size, true);
    ch.setUint16(28, c.nameB.length, true);
    ch.setUint32(42, c.offset, true);
    chunks.push(new Uint8Array(ch.buffer), c.nameB);
    offset += 46 + c.nameB.length;
  }
  const cdSize = offset - cdStart;
  const eocd = new DataView(new ArrayBuffer(22));
  eocd.setUint32(0, 0x06054b50, true);
  eocd.setUint16(8, central.length, true);
  eocd.setUint16(10, central.length, true);
  eocd.setUint32(12, cdSize, true);
  eocd.setUint32(16, cdStart, true);
  chunks.push(new Uint8Array(eocd.buffer));
  const total = chunks.reduce((a, c) => a + c.length, 0);
  const out = new Uint8Array(total);
  let pos = 0;
  for (const c of chunks){ out.set(c, pos); pos += c.length; }
  return out;
}

/* ---------- XLSX lesen ---------- */
function parseSharedStrings(xmlStr){
  const doc = new DOMParser().parseFromString(xmlStr, "application/xml");
  const out = [];
  const sis = doc.getElementsByTagName("si");
  for (let i = 0; i < sis.length; i++) out.push(sis[i].textContent);
  return out;
}

function colIndexFromRef(ref){
  let col = 0;
  for (let i = 0; i < ref.length; i++){
    const ch = ref.charCodeAt(i);
    if (ch >= 65 && ch <= 90) col = col * 26 + (ch - 64);
    else break;
  }
  return col - 1;
}

function parseSheet(xmlStr, sharedStrings){
  const doc = new DOMParser().parseFromString(xmlStr, "application/xml");
  if (doc.getElementsByTagName("parsererror").length) throw new Error("Fehler beim Parsen eines Arbeitsblatts.");
  const rows = [];
  const rowEls = doc.getElementsByTagName("row");
  for (let r = 0; r < rowEls.length; r++){
    const row = [];
    const cells = rowEls[r].getElementsByTagName("c");
    for (let c = 0; c < cells.length; c++){
      const cell = cells[c];
      const ref = cell.getAttribute("r") || "";
      const col = colIndexFromRef(ref);
      const t = cell.getAttribute("t");
      let v = "";
      if (t === "inlineStr"){
        const isEls = cell.getElementsByTagName("is");
        v = isEls.length ? isEls[0].textContent : "";
      } else {
        const vEls = cell.getElementsByTagName("v");
        if (vEls.length){
          const txt = vEls[0].textContent;
          if (t === "s") v = sharedStrings[parseInt(txt, 10)] !== undefined ? sharedStrings[parseInt(txt, 10)] : "";
          else if (t === "b") v = (txt === "1");
          else { const n = Number(txt); v = (txt.trim() !== "" && isFinite(n)) ? n : txt; }
        }
      }
      row[col] = v;
    }
    rows.push(row);
  }
  return rows;
}

function parseWorkbook(u8){
  const files = readZip(u8);
  const ss = files["xl/sharedStrings.xml"] ? parseSharedStrings(bytesToStr(files["xl/sharedStrings.xml"])) : [];
  const wbDoc = new DOMParser().parseFromString(bytesToStr(files["xl/workbook.xml"]), "application/xml");
  const relDoc = new DOMParser().parseFromString(bytesToStr(files["xl/_rels/workbook.xml.rels"]), "application/xml");
  const relMap = {};
  const rels = relDoc.getElementsByTagName("Relationship");
  for (let i = 0; i < rels.length; i++) relMap[rels[i].getAttribute("Id")] = rels[i].getAttribute("Target");
  const sheets = [];
  const sheetEls = wbDoc.getElementsByTagName("sheet");
  for (let i = 0; i < sheetEls.length; i++){
    let target = relMap[sheetEls[i].getAttribute("r:id")] || "";
    if (target.charAt(0) === "/") target = target.slice(1);
    else if (target.indexOf("xl/") !== 0) target = "xl/" + target;
    if (!files[target]) throw new Error("Arbeitsblatt-Datei fehlt: " + target);
    sheets.push({ name: sheetEls[i].getAttribute("name"), rows: parseSheet(bytesToStr(files[target]), ss) });
  }
  const byName = function(n){ return sheets.filter(s => s.name === n)[0]; };
  const vSheet = byName("Vokabeln");
  if (!vSheet) throw new Error("Sheet „Vokabeln“ nicht gefunden (vorhanden: " + sheets.map(s => s.name).join(", ") + ").");
  return { vrows: vSheet.rows };
}

/* ---------- XLSX schreiben ---------- */
function xmlEsc(s){
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function colName(i0){
  let i = i0 + 1, s = "";
  while (i > 0){ const r = (i - 1) % 26; s = String.fromCharCode(65 + r) + s; i = Math.floor((i - 1) / 26); }
  return s;
}
function buildSheetXml(rows, numericCols){
  let xml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';
  for (let r = 0; r < rows.length; r++){
    xml += '<row r="' + (r + 1) + '">';
    const row = rows[r];
    for (let c = 0; c < row.length; c++){
      const cell = row[c];
      if (cell === "" || cell === undefined || cell === null) continue;
      const ref = colName(c) + (r + 1);
      if (numericCols.indexOf(c) >= 0) xml += '<c r="' + ref + '"><v>' + cell + '</v></c>';
      else xml += '<c r="' + ref + '" t="inlineStr"><is><t xml:space="preserve">' + xmlEsc(cell) + '</t></is></c>';
    }
    xml += "</row>";
  }
  xml += "</sheetData></worksheet>";
  return strToBytes(xml);
}

function buildExport(){
  const vrows = S.vocab.map(v => { const p=S.progress[vkey(v)] || {}; return [v.de, v.deInfo, v.ru, v.ruInfo, v.deEx, v.ruEx, stageOf(v), p.since || ""]; });
  const ct = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
    + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
    + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
    + '<Default Extension="xml" ContentType="application/xml"/>'
    + '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
    + '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'
    + "</Types>";
  const rels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
    + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'
    + "</Relationships>";
  const wbxml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
    + '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'
    + '<sheets><sheet name="Vokabeln" sheetId="1" r:id="rId1"/></sheets></workbook>';
  const wbrels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
    + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>'
    + "</Relationships>";
  return writeZip([
    { name: "[Content_Types].xml", data: strToBytes(ct) },
    { name: "_rels/.rels", data: strToBytes(rels) },
    { name: "xl/workbook.xml", data: strToBytes(wbxml) },
    { name: "xl/_rels/workbook.xml.rels", data: strToBytes(wbrels) },
    { name: "xl/worksheets/sheet1.xml", data: buildSheetXml(vrows, [6]) }
  ]);
}

/* ---------- Zustand ---------- */
const LS_KEY = "vokabeltrainer-v1";
function defaultState(){
  return { fileName: null, vocab: [], progress: {}, params: [0, 1, 3, 8, 30, 90, 180],
           settings: { paket: 10, umfang: "all", dir: "ru2de", stage: 0, trainMode: "written", editorSort: "stage", editorSortDir: "asc" }, warnings: [] };
}
function loadState(){
  try {
    const s = JSON.parse(localStorage.getItem(LS_KEY));
    if (s && Array.isArray(s.vocab)){
      const d = defaultState();
      s.settings = Object.assign(d.settings, s.settings || {});
      return Object.assign(d, s);
    }
  } catch (e) {}
  return defaultState();
}
let S = loadState();
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(S)); }

/* ---------- Datums-Logik ---------- */
function todayStr(d){
  d = d || new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function addDays(dateStr, n){
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + n);
  return todayStr(d);
}
function daysBetween(a, b){
  return Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000);
}
function normalizeDateCell(x){
  if (x === undefined || x === null || x === "") return "";
  if (typeof x === "number"){
    const d = new Date(Date.UTC(1899, 11, 30) + Math.floor(x) * 86400000);
    return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0");
  }
  const t=String(x).trim();
  let m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m) return m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0");
  m=t.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})$/);
  if(m){ return m[3]+"-"+m[1].padStart(2,"0")+"-"+m[2].padStart(2,"0"); }
  return "";
}

/* ---------- Lern-Modell ---------- */
function vkey(v){ return v.de + "" + v.deInfo + "" + v.ru + "" + v.ruInfo; }

function stageOf(v){
  const p = S.progress[vkey(v)];
  return p ? p.stage : 1;
}
function isDue(v){
  const st = stageOf(v);
  if (st === 0 || st === 8) return false;
  const p = S.progress[vkey(v)];
  if (p && p.retry && todayStr() < p.retry) return false;
  const wait = (S.params[st - 1] !== undefined) ? S.params[st - 1] : 0;
  const since = (p && p.since) ? p.since : todayStr();
  return daysBetween(since, todayStr()) >= wait;
}
function recordSuccess(v){
  const k = vkey(v);
  const p = S.progress[k] || { stage: 1, since: todayStr() };
  const st = p.stage;
  if (st === 0 || st === 8) return "learned";
  if (st === 7){ S.progress[k] = { stage: 8, since: todayStr() }; return "learned"; }
  S.progress[k] = { stage: st + 1, since: todayStr() };
  return "ok";
}
function recordFail(v){
  const k = vkey(v);
  const p = S.progress[k] || { stage: 1, since: todayStr() };
  const st = p.stage;
  if (st === 0 || st === 8) return;
  S.progress[k] = { stage: st, since: (p.since || todayStr()), retry: addDays(todayStr(), 1) };
}
function stats(){
  let learned = 0, due = 0, newCount = 0, inWork = 0;
  for (const v of S.vocab){
    const st = stageOf(v);
    if (st === 0 || st === 8){ learned++; continue; }
    if (st === 1) newCount++; else inWork++;
    if (isDue(v)) due++;
  }
  return { total: S.vocab.length, learned: learned, due: due, newCount: newCount, inWork: inWork };
}

/* ---------- Richtungswahl ---------- */
function promptOf(it, dir){ return dir === "de2ru" ? it.de : it.ru; }
function promptInfoOf(it, dir){ return dir === "de2ru" ? it.deInfo : it.ruInfo; }
function answerOf(it, dir){ return dir === "de2ru" ? it.ru : it.de; }
function answerInfoOf(it, dir){ return dir === "de2ru" ? it.ruInfo : it.deInfo; }

/* ---------- Import ---------- */
function applyImport(result, fname){
  const warnings = [];
  const seen = new Set();
  const vocab = [];
  const stages = [];
  let dup = 0;
  let stageFromE = false;
  const rows = result.vrows;
  for (let i = 0; i < rows.length; i++){
    const r = rows[i];
    if (!r) continue;
    let empty = true;
    for (let j = 0; j <= 6; j++){ if (r[j] !== undefined && r[j] !== ""){ empty = false; break; } }
    if (empty) continue;
    const get = function(j){ return (r[j] === undefined || r[j] === null) ? "" : String(r[j]).trim(); };
    const de = get(0), deInfo = get(1), ru = get(2), ruInfo = get(3), deEx = get(4), ruEx = get(5);
    let g = get(6);
    const since = normalizeDateCell(r[7]);
    if (g === ""){
      // Fallback: 5-spaltige Dateien (ohne Beispielsaetze) tragen die Lernstufe in Spalte E
      const e = get(4), f = get(5);
      if (f === "" && /^\d+$/.test(e)){ g = e; stageFromE = true; }
    }
    if (!de || !ru){ warnings.push("Zeile " + (i + 1) + ": Deutsch oder Russisch leer - uebersprungen."); continue; }
    if ([de, deInfo, ru, ruInfo, deEx, ruEx].some(x => x.length > 50))
      warnings.push("Zeile " + (i + 1) + ": mehr als 50 Zeichen.");
    let stage = (g === "") ? 1 : Number(g);
    if (!Number.isInteger(stage) || stage < 0 || stage > 8){
      warnings.push("Zeile " + (i + 1) + ": ungueltige Lernstufe '" + g + "' - auf 1 gesetzt.");
      stage = 1;
    }
    // Stufe 8 bleibt erhalten und gilt als gelernt.
    const v = { de: de, deInfo: deInfo, ru: ru, ruInfo: ruInfo, deEx: deEx, ruEx: ruEx };
    const k = vkey(v);
    if (seen.has(k)){ dup++; continue; }
    seen.add(k);
    vocab.push(v);
    stages.push({stage: stage, since: since});
  }
  if (dup > 0) warnings.unshift(dup + " doppelte Zeile(n) uebersprungen.");
  if (stageFromE) warnings.unshift("Spalte G war leer - Lernstufen wurden aus Spalte E gelesen.");

  const newProgress = {};
  for (let i = 0; i < vocab.length; i++){
    const k = vkey(vocab[i]);
    const entry = stages[i];
    const stage = entry.stage;
    const old = S.progress[k];
    newProgress[k] = { stage: stage, since: entry.since || (old && old.stage === stage && old.since) || todayStr() };
  }
  S.progress = newProgress;

  S.fileName = fname;
  S.vocab = vocab;
  S.warnings = warnings;
  save();
}

function importFile(file){
  const reader = new FileReader();
  reader.onload = function(){
    try {
      const result = parseWorkbook(new Uint8Array(reader.result));
      applyImport(result, file.name);
      go("home");
    } catch (e){
      alert("Fehler beim Lesen der Datei: " + e.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

/* ---------- Auswahl der Sitzungs-Vokabeln ---------- */
function shuffle(a){
  for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function pickItems(useAll, stage){
  let items = S.vocab.filter(v => isDue(v) && (stage === 0 || stageOf(v) === stage));
  shuffle(items);
  if (!useAll) items = items.slice(0, Math.max(1, S.settings.paket || 10));
  return items;
}

function bindRussianKeyboard(input){
  const kb=document.getElementById('ru-kbd'); if(!kb)return;
  let shifted=false;
  function drawCase(){
    kb.querySelectorAll('[data-char]').forEach(function(b){ const ch=b.dataset.char; b.textContent=/[а-яё]/i.test(ch) ? (shifted?ch.toUpperCase():ch.toLowerCase()) : ch; });
    const sh=kb.querySelector('[data-action="shift"]'); if(sh) sh.classList.toggle('shift-active',shifted);
  }
  kb.onclick=function(e){
    const b=e.target.closest('button'); if(!b||input.disabled)return;
    if(b.dataset.action==='shift'){ shifted=!shifted; drawCase(); input.focus(); return; }
    let a=input.selectionStart??input.value.length,z=input.selectionEnd??a;
    if(b.dataset.action==='backspace'){ if(a!==z)input.value=input.value.slice(0,a)+input.value.slice(z); else if(a>0){input.value=input.value.slice(0,a-1)+input.value.slice(z);a--;} input.focus();input.setSelectionRange(a,a);return; }
    let ch=b.dataset.action==='space'?' ':b.dataset.char;
    if(ch && /[а-яё]/i.test(ch)) ch=shifted?ch.toUpperCase():ch.toLowerCase();
    input.value=input.value.slice(0,a)+ch+input.value.slice(z); a+=ch.length; input.focus();input.setSelectionRange(a,a);
    if(shifted && /[А-ЯЁ]/.test(ch)){ shifted=false; drawCase(); }
  };
  drawCase();
}

function hangmanChars(answer){ return Array.from(new Set(Array.from(answer).filter(ch => /[\p{L}\p{N}]/u.test(ch)))); }
function hangmanMask(answer, pos){ return Array.from(answer).map((ch,i)=>/[\p{L}\p{N}]/u.test(ch) ? (i<pos?ch:'_') : ch).join(''); }
function renderHangmanCard(v,it){
  const answer=answerOf(it,'de2ru'); let pos=0, errors=0, finished=false;
  const keys=shuffle(hangmanChars(answer).slice());
  v.innerHTML='<div class="card"><div class="meta">Training · Hangman · DE → RU · Vokabel '+(sess.idx+1)+' von '+sess.items.length+'</div><div class="ru">'+esc(it.de)+'</div>'+(it.deInfo?'<div class="info">'+esc(it.deInfo)+'</div>':'')+'<div id="hang-answer" class="hang-answer"></div><div class="dim">Fehler: <span id="hang-errors">0</span> / 4</div><div id="hang-keys" class="hang-keys"></div><div id="fb"></div><button class="btn ghost" id="abort">Abbrechen</button></div>';
  const out=document.getElementById('hang-answer'), box=document.getElementById('hang-keys'), fb=document.getElementById('fb');

  function draw(){ out.textContent=hangmanMask(answer,pos); box.innerHTML=''; keys.forEach(ch=>{const b=document.createElement('button');b.className='btn hang-key';b.textContent=ch;b.onclick=()=>choose(ch);box.appendChild(b);}); }
  function done(ok){ finished=true; box.querySelectorAll('button').forEach(b=>b.disabled=true); if(ok){sess.correct++;fb.innerHTML='<div class="fb good">Richtig! '+errors+' Fehler.</div>';}else{sess.wrong++;sess.failed.push(it);fb.innerHTML='<div class="fb bad">Leider falsch. Mehr als 4 Fehler.</div><div class="fb-answer">Richtig wäre: <b>'+esc(answer)+'</b></div><button class="btn" id="override">Trotzdem korrekt</button>';}
    fb.innerHTML+='<button class="btn primary" id="next">'+(sess.idx+1>=sess.items.length?'Ergebnis':'Weiter')+'</button>';
    document.getElementById('next').onclick=()=>{sess.idx++;sess.done=false;render();}; const ov=document.getElementById('override');if(ov)ov.onclick=()=>{sess.wrong--;sess.correct++;const p=sess.failed.lastIndexOf(it);if(p>=0)sess.failed.splice(p,1);fb.innerHTML='<div class="fb good">Als korrekt gewertet.</div><button class="btn primary" id="next2">Weiter</button>';document.getElementById('next2').onclick=()=>{sess.idx++;render();};}; }
  function choose(ch){ if(finished)return; advanceAuto(); if(ch===answer[pos]){pos++;advanceAuto();draw();if(pos>=answer.length)done(errors<=4);}else{errors++;document.getElementById('hang-errors').textContent=errors;if(errors>4)done(false);} }

}

    const duplicate=S.vocab.some((x,i)=>i!==index && vkey(x)===newKey); if(duplicate)return alert('Diese Vokabel ist bereits vorhanden.');
    if(old){const oldKey=vkey(old), oldp=Object.assign({},S.progress[oldKey]||{}); if(oldKey!==newKey)delete S.progress[oldKey];S.vocab[index]=nv;S.progress[newKey]=Object.assign({},oldp,{stage:st,since:since});}
    else{S.vocab.push(nv);S.progress[newKey]={stage:st,since:since};} save();editorSelected.clear();renderVocabEditor(v);
  };
}

function renderSettings(v){let waits='<h3>Wartezeiten zwischen den Lernstufen</h3>';for(let i=0;i<7;i++)waits+='<p><label>Stufe '+(i+1)+' → '+(i+2)+': <input type="number" class="wait-days" data-i="'+i+'" min="0" value="'+S.params[i]+'" style="width:6em"> Tag(e)</label></p>';const es=S.settings.editorSort||"stage",ed=S.settings.editorSortDir||"asc";v.innerHTML='<div class="card"><h2>Einstellungen</h2><p><label>Standard-Paketgröße: <input type="number" id="paket" min="1" max="999" value="'+(S.settings.paket||10)+'" style="width:4.5em"></label></p>'+waits+'<h3>Standard-Sortierung im Vokabeleditor</h3><select id="default-editor-sort"><option value="stage" '+(es==='stage'?'selected':'')+'>nach Lernstufe</option><option value="de" '+(es==='de'?'selected':'')+'>alphabetisch nach deutscher Vokabel</option><option value="ru" '+(es==='ru'?'selected':'')+'>alphabetisch nach russischer Vokabel</option><option value="date" '+(es==='date'?'selected':'')+'>nach Erreichungsdatum</option></select><select id="default-editor-dir"><option value="asc" '+(ed==='asc'?'selected':'')+'>aufsteigend</option><option value="desc" '+(ed==='desc'?'selected':'')+'>absteigend</option></select><button class="btn primary" id="save">Speichern</button><hr><h3>Gefahrenzone</h3><button class="btn danger" id="reset">Alle App-Daten löschen</button></div>';document.getElementById("save").onclick=function(){const n=parseInt(document.getElementById("paket").value,10);if(isFinite(n)&&n>0)S.settings.paket=n;document.querySelectorAll(".wait-days").forEach(function(el){const x=parseInt(el.value,10);if(isFinite(x)&&x>=0)S.params[Number(el.dataset.i)]=x;});S.settings.editorSort=document.getElementById('default-editor-sort').value;S.settings.editorSortDir=document.getElementById('default-editor-dir').value;save();alert("Gespeichert.");};document.getElementById("reset").onclick=function(){if(confirm("Wirklich alle Vokabeln und Lernstände in der App löschen? (Die Excel-Datei bleibt unberührt.)")){S=defaultState();save();go("home");}};}
function bindImport(root){
  const inp = root.querySelector("#import-input");
  if (inp) inp.addEventListener("change", function(){ if (inp.files.length) importFile(inp.files[0]); });
}

function doExport(){
  const bytes = buildExport();
  const blob = new Blob([bytes], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = S.fileName || "Vokabeln.xlsx";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 5000);
}

function initUI(){
  document.querySelectorAll("#nav button").forEach(function(b){
    b.onclick = function(){ go(b.getAttribute("data-view")); };
  });
  render();
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  }
}
if (typeof document !== "undefined") initUI();

if (typeof module !== "undefined" && module.exports){
  module.exports = {
    parseWorkbook: parseWorkbook, applyImport: applyImport, buildExport: buildExport,
    isDue: isDue, stageOf: stageOf, recordSuccess: recordSuccess, recordFail: recordFail,
    normAnswer: normAnswer, todayStr: todayStr, addDays: addDays, vkey: vkey,
    readZip: readZip, writeZip: writeZip, pickItems: pickItems,
    promptOf: promptOf, answerOf: answerOf, promptInfoOf: promptInfoOf, answerInfoOf: answerInfoOf,
    getS: function(){ return S; }
  };
}
